---
- name: Debian Server Hardening
  hosts: localhost
  connection: local
  become: true

  tasks:
    # ==========================================
    # 1. INSTALLATION LAYER
    # ==========================================
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install security, integrity, and container tools
      ansible.builtin.apt:
        name:
          - libpam-tmpdir
          - libpam-pwquality
          - aide
          - aide-common
          - debsums
          - apparmor
          - apparmor-profiles
          - apparmor-utils
          - unattended-upgrades
          - podman
          - slirp4netns
          - fuse-overlayfs
          - clamav
          - clamav-daemon
          - fail2ban
          - needrestart
          - acct
          - apt-listbugs
        state: present

    # ==========================================
    # 2. USER & ACCESS CONFIGURATION
    # ==========================================
    - name: Ensure admin user is in the sudo group
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: sudo
        append: yes
        shell: /bin/bash

    - name: Harden SSH configuration
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regex }}"
        line: "{{ item.line }}"
        state: present
        validate: '/usr/sbin/sshd -t -f %s'
      loop:
        - { regex: '^PermitRootLogin', line: 'PermitRootLogin no' }
        - { regex: '^MaxAuthTries', line: 'MaxAuthTries 3' }
        - { regex: '^ClientAliveInterval', line: 'ClientAliveInterval 300' }
        - { regex: '^ClientAliveCountMax', line: 'ClientAliveCountMax 0' }
        - { regex: '^AllowTcpForwarding', line: 'AllowTcpForwarding no' }
        - { regex: '^LogLevel', line: 'LogLevel VERBOSE' }
        - { regex: '^MaxSessions', line: 'MaxSessions 2' }
        - { regex: '^TCPKeepAlive', line: 'TCPKeepAlive no' }
        - { regex: '^X11Forwarding', line: 'X11Forwarding no' }
        - { regex: '^AllowAgentForwarding', line: 'AllowAgentForwarding no' }
      notify: restart ssh

    # ==========================================
    # 3. SYSTEM CONFIGURATION LAYER
    # ==========================================
    - name: Apply network security hardening via sysctl
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-hardening.conf
        reload: yes
      loop:
        - { key: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { key: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { key: 'net.ipv4.tcp_syncookies', value: '1' }
        - { key: 'kernel.dmesg_restrict', value: '1' }

    - name: Set global UMASK to 027
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^UMASK'
        line: 'UMASK           027'

    - name: Enable log compression in logrotate
      ansible.builtin.lineinfile:
        path: /etc/logrotate.conf
        regexp: '^#compress'
        line: 'compress'

    # ==========================================
    # 4. AUTOMATED MAINTENANCE (SYSTEMD TIMERS)
    # ==========================================
    
    # MALWARE SCAN AUTOMATION
    - name: Create Daily ClamAV Service definition
      ansible.builtin.copy:
        dest: /etc/systemd/system/clamscan-daily.service
        mode: '0644'
        content: |
          [Unit]
          Description=Daily ClamAV Malware Scan
          After=network.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/clamscan -r /home /tmp /var/www --quiet --log=/var/log/clamav/daily_scan.log

    - name: Create Daily ClamAV Timer definition
      ansible.builtin.copy:
        dest: /etc/systemd/system/clamscan-daily.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Run ClamAV Malware Scan Daily at 2:00 AM

          [Timer]
          OnCalendar=*-*-* 02:00:00
          Persistent=true

          [Install]
          WantedBy=timers.target

    # FILESYSTEM INTEGRITY AUTOMATION
    - name: Create Daily AIDE Check Service definition
      ansible.builtin.copy:
        dest: /etc/systemd/system/aide-daily.service
        mode: '0644'
        content: |
          [Unit]
          Description=Daily AIDE Integrity Check

          [Service]
          Type=oneshot
          ExecStart=/bin/sh -c "/usr/sbin/aide --check > /var/log/aide/aide.log 2>&1"

    - name: Create Daily AIDE Check Timer definition
      ansible.builtin.copy:
        dest: /etc/systemd/system/aide-daily.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Run AIDE Integrity Check Daily at 3:00 AM

          [Timer]
          OnCalendar=*-*-* 03:00:00
          Persistent=true

          [Install]
          WantedBy=timers.target

    # DEBIAN PACKAGE VERIFICATION AUTOMATION
    - name: Create Weekly Debsums Service definition
      ansible.builtin.copy:
        dest: /etc/systemd/system/debsums-weekly.service
        mode: '0644'
        content: |
          [Unit]
          Description=Weekly Debsums Verification

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/debsums -cs

    - name: Create Weekly Debsums Timer definition
      ansible.builtin.copy:
        dest: /etc/systemd/system/debsums-weekly.timer
        mode: '0644'
        content: |
          [Unit]
          Description=Run Debsums Verification Weekly on Sunday at 4:00 AM

          [Timer]
          OnCalendar=Sun *-*-* 04:00:00
          Persistent=true

          [Install]
          WantedBy=timers.target

    # START AUTOMATION CHANNELS
    - name: Enable and start security systemd timers
      ansible.builtin.systemd:
        daemon_reload: yes
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - clamscan-daily.timer
        - aide-daily.timer
        - debsums-weekly.timer

    # ==========================================
    # 5. ENFORCEMENT LAYER
    # ==========================================
    - name: Ensure AppArmor is enabled and running
      ansible.builtin.systemd:
        name: apparmor
        enabled: yes
        state: started

  handlers:
    - name: restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted
