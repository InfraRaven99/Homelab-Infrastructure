---
- name: Network Stack
  hosts: localhost
  connection: local
  become: false
  vars:
    deploy_user: "placeholder"
    upstream_dns_ip: "placeholder" 
    npm_base_dir: "/home/{{ deploy_user }}/nginx-proxy-manager"
    dns_base_dir: "/home/{{ deploy_user }}/adguard"
    quadlet_dir: "/home/{{ deploy_user }}/.config/containers/systemd"

  tasks:
    # SYSTEM PREREQUISITES (RUNS AS ROOT)
    # ==========================================================
    - name: Install Podman and rootless system packages
      become: true
      ansible.builtin.apt:  
        name: [podman, uidmap, acl]
        state: present
        update_cache: yes

    - name: Completely stop and disable systemd-resolved to free port 53
      become: true
      ansible.builtin.systemd:
        name: systemd-resolved
        state: stopped
        enabled: false

    - name: Point system resolver directly to DNS server
      become: true
      ansible.builtin.copy:  
        dest: /etc/resolv.conf
        content: "nameserver {{ upstream_dns_ip }}\n"
        mode: '0644'

    - name: Lower unprivileged port binding limits persistently inside drop-in conf
      become: true
      ansible.posix.sysctl:
        name: net.ipv4.ip_unprivileged_port_start
        value: "0"
        sysctl_file: /etc/sysctl.d/99-rootless-ports.conf 
        sysctl_set: true
        state: present
        reload: true

    - name: Grant background service persistence (linger) to the user
      become: true
      ansible.builtin.command: "loginctl enable-linger {{ deploy_user }}"
      args:
        creates: "/var/lib/systemd/linger/{{ deploy_user }}"

    # USER DEPLOYMENT (RUNS AS DEPLOY USER)
    # ==========================================================
    - name: Build local application storage directories inside home folder
      become: true
      become_user: "{{ deploy_user }}"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ npm_base_dir }}/data"
        - "{{ npm_base_dir }}/letsencrypt"
        - "{{ dns_base_dir }}/work"
        - "{{ dns_base_dir }}/conf"
        - "{{ quadlet_dir }}"

    - name: Create Nginx Proxy Manager Quadlet definition
      become: true
      become_user: "{{ deploy_user }}"
      ansible.builtin.copy:
        dest: "{{ quadlet_dir }}/nginx-proxy-manager.container"
        mode: '0644'
        content: |
          [Container]
          Image=docker.io/jc21/nginx-proxy-manager:latest
          PublishPort=80:80
          PublishPort=443:443
          PublishPort=81:81
          Volume={{ npm_base_dir }}/data:/data:Z
          Volume={{ npm_base_dir }}/letsencrypt:/etc/letsencrypt:Z
          
          [Service]
          Restart=always
                    
          [Install]
          WantedBy=default.target

    - name: Create AdGuard Home Quadlet definition
      become: true
      become_user: "{{ deploy_user }}"
      ansible.builtin.copy:
        dest: "{{ quadlet_dir }}/adguard.container"
        mode: '0644'
        content: |
          [Container]
          Image=docker.io/adguard/adguardhome:latest
          PublishPort=53:53/tcp
          PublishPort=53:53/udp
          PublishPort=3000:3000/tcp
          PublishPort=8080:80/tcp
          UserNS=keep-id
          Volume={{ dns_base_dir }}/work:/opt/adguardhome/work:Z
          Volume={{ dns_base_dir }}/conf:/opt/adguardhome/conf:Z
          
          [Service]
          Restart=always
                    
          [Install]
          WantedBy=default.target

    # SERVICE MANAGEMENT (RUNS AS DEPLOY USER)
    # ==========================================================
    - name: Force systemd to process Quadlets and start services
      become: true
      become_user: "{{ deploy_user }}"
      ansible.builtin.systemd:
        daemon_reload: yes
        scope: user
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - nginx-proxy-manager
        - adguard
